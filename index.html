<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GE Wheaton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EAEE; --surface:#FFFFFF; --surface-2:#F3F5F7; --ink:#18222D; --muted:#5A6676; --line:#D2D8DF;
  --primary:#1F5A8C; --primary-ink:#FFFFFF; --primary-soft:#DDE8F3; --accent:#F2B705; --danger:#B42318; --bubble:#DCF5D4;
  --t-bg:#D6EEDF; --t-fg:#145A32; --t-bar:#2E9E5B;
  --f-bg:#DCE8F7; --f-fg:#1D4E89; --f-bar:#4A82C4;
  --v-bg:#FBEFC8; --v-fg:#7A5600; --v-bar:#D9A400;
  --a-bg:#F8DADA; --a-fg:#8B1E1E; --a-bar:#D14B4B;
  --x-bg:#E8DDFB; --x-fg:#5B2BA6; --x-bar:#8A5CD6;
  --ag-troca:#9A5700; --ag-troca-bg:#FFEFD6; --ag-parada:#B3261E; --ag-parada-bg:#FCE4E2; --ag-amostra:#1F6B59; --ag-amostra-bg:#DCF1EA; --ag-nota:#6A3FA3; --ag-nota-bg:#EEE5FA; --ag-geral:#1D5FA6; --ag-geral-bg:#E0EBF8; --ag-outro:#4C5966; --ag-outro-bg:#E5E9ED;
  --font:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161C; --surface:#1A2129; --surface-2:#222B35; --ink:#E5EAF0; --muted:#97A3B1; --line:#2D3743;
    --primary:#6FA8DC; --primary-ink:#0E1A26; --primary-soft:#1D3044; --danger:#F07167; --bubble:#1E3A2B;
    --t-bg:#1E3A2A; --t-fg:#8FD6AA; --f-bg:#1C2D44; --f-fg:#9CC2EE; --v-bg:#3B3014; --v-fg:#F0CF6E;
    --a-bg:#43201F; --a-fg:#F1A3A0; --x-bg:#33264D; --x-fg:#C9B0F5;
    --ag-troca:#F2A33A; --ag-troca-bg:#3A2A12; --ag-parada:#F2766C; --ag-parada-bg:#3D1B19; --ag-amostra:#52C7A6; --ag-amostra-bg:#13332B; --ag-nota:#B994F5; --ag-nota-bg:#2C2141; --ag-geral:#6EA9F0; --ag-geral-bg:#16293E; --ag-outro:#A9B4BE; --ag-outro-bg:#27313A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#1A2129; --surface-2:#222B35; --ink:#E5EAF0; --muted:#97A3B1; --line:#2D3743;
  --primary:#6FA8DC; --primary-ink:#0E1A26; --primary-soft:#1D3044; --danger:#F07167; --bubble:#1E3A2B;
  --t-bg:#1E3A2A; --t-fg:#8FD6AA; --f-bg:#1C2D44; --f-fg:#9CC2EE; --v-bg:#3B3014; --v-fg:#F0CF6E;
  --a-bg:#43201F; --a-fg:#F1A3A0; --x-bg:#33264D; --x-fg:#C9B0F5;
  --ag-troca:#F2A33A; --ag-troca-bg:#3A2A12; --ag-parada:#F2766C; --ag-parada-bg:#3D1B19; --ag-amostra:#52C7A6; --ag-amostra-bg:#13332B; --ag-nota:#B994F5; --ag-nota-bg:#2C2141; --ag-geral:#6EA9F0; --ag-geral-bg:#16293E; --ag-outro:#A9B4BE; --ag-outro-bg:#27313A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{font-family:var(--cond);font-weight:700;font-size:1.45rem;display:flex;align-items:center;gap:10px;line-height:1}
.tape{width:12px;height:24px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,#18222D 5px 10px)}
.clock{text-align:right;line-height:1.1}
.clock b{font-family:var(--cond);font-weight:700;font-size:1.25rem;display:block}
.clock span{font-size:.75rem;color:var(--muted);font-weight:500;text-transform:capitalize}

main{max-width:880px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--cond);font-weight:700;font-size:1.8rem;line-height:1.1;margin:2px 0 12px}
h2{font-family:var(--cond);font-weight:700;font-size:1.25rem;line-height:1.15;margin:0 0 10px}
h3{font-size:.95rem;font-weight:700;margin:0 0 8px}
p{margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1 1 130px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.titlebar h1{margin:0}

select,input,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-height:44px}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--primary);flex:none;margin:1px 0 0}

.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.92rem}
.btn.ghost{border-color:transparent;background:transparent;padding-left:4px}
.icon-btn{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;cursor:pointer;padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn.danger{color:var(--danger)}
.icon-btn.add{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

.chip{display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.3}
.s-trabalho{background:var(--t-bg);color:var(--t-fg)}
.s-folga{background:var(--f-bg);color:var(--f-fg)}
.s-ferias{background:var(--v-bg);color:var(--v-fg)}
.s-falta{background:var(--a-bg);color:var(--a-fg)}
.s-extra{background:var(--x-bg);color:var(--x-fg)}
.b-trabalho{background:var(--t-bar)} .b-folga{background:var(--f-bar)} .b-ferias{background:var(--v-bar)} .b-falta{background:var(--a-bar)} .b-extra{background:var(--x-bar)}
.chip.area{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:600;font-size:.92rem;padding:7px 6px;border-radius:7px;color:var(--muted);min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

.list{margin:0;padding:0;list-style:none}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item:last-child{padding-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .t.done{text-decoration:line-through;color:var(--muted)}
.item .m{font-size:.85rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.item .acts{display:flex;gap:6px;flex:none}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty .btn{margin-top:10px}

/* calendário */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-month{font-family:var(--cond);font-weight:700;font-size:1.55rem;flex:1;text-transform:capitalize;line-height:1.1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:.72rem;font-weight:600;color:var(--muted);text-align:center;padding:2px 0 4px}
.day{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:70px;padding:6px 5px 5px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day .n{font-family:var(--cond);font-weight:700;font-size:1.1rem;line-height:1}
.day .fol{font-size:.62rem;font-weight:700;color:var(--f-fg);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .cnt{font-size:.66rem;color:var(--muted);font-weight:600;margin-top:auto;line-height:1}
.day .bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.day.today::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,#18222D 6px 12px)}
.day.sel{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--primary-soft)}
.day.blank{visibility:hidden}
.day.low{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.day.low .cnt{color:var(--danger)}
.day .lowmark{position:absolute;top:6px;right:5px;width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.chip.lowchip{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.lim+.lim{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.lim .fld{margin:10px 0 0}
@media (min-width:700px){.day{min-height:100px;padding:8px}.day .n{font-size:1.3rem}.day .fol{font-size:.72rem}.day .cnt{font-size:.75rem}.day .bar{height:7px}}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.group{margin-top:12px}
.group:first-of-type{margin-top:4px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names .chip{font-size:.85rem;padding:4px 10px}

/* escala */
.wk{padding:10px 0;border-top:1px solid var(--line)}
.wk:first-child{border-top:0;padding-top:0}
.wk.extra{background:var(--x-bg);border-radius:10px;padding:10px;border-top:0;margin:6px 0}
.wk .nm{font-weight:600;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mrow{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;align-items:center;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 10px;font-size:.88rem;font-weight:600}
.tag button{border:0;background:transparent;color:var(--danger);width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.tag button svg{width:15px;height:15px}
.blk+.blk{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.bubble{white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:.95rem;line-height:1.45;background:var(--bubble);border-radius:12px 12px 12px 4px;padding:12px 14px;margin:0 0 12px}
.actions{display:grid;gap:8px}

/* mais */
.menu{display:grid;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;color:inherit;cursor:pointer}
.menu .tx{flex:1;min-width:0}
.menu .tx b{display:block;font-weight:700}
.menu .tx span{font-size:.85rem;color:var(--muted)}
.menu .ct{font-family:var(--cond);font-weight:700;font-size:1.2rem;color:var(--muted)}
.menu svg{width:18px;height:18px;color:var(--muted)}
.menu .mi{width:42px;height:42px;flex:none;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
.menu .mi svg{width:22px;height:22px;color:inherit}
.dethead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:10px}
.dethead h2{margin:0}
.folga-chip{font-size:.85rem;padding:4px 10px}

/* agenda */
.k-troca{--c:var(--ag-troca);--cb:var(--ag-troca-bg)} .k-parada{--c:var(--ag-parada);--cb:var(--ag-parada-bg)}
.k-amostra{--c:var(--ag-amostra);--cb:var(--ag-amostra-bg)} .k-t2{--c:var(--ag-nota);--cb:var(--ag-nota-bg)}
.k-geral{--c:var(--ag-geral);--cb:var(--ag-geral-bg)} .k-outro{--c:var(--ag-outro);--cb:var(--ag-outro-bg)}
.ktag{display:inline-flex;align-items:center;font-size:.74rem;font-weight:700;padding:3px 7px;border-radius:4px;background:var(--cb);color:var(--c);white-space:nowrap;line-height:1.2}
.ktag.solid{background:var(--c);color:var(--surface)}
.placa{display:block;width:100%;text-align:left;font:inherit;color:inherit;border-top:6px solid var(--c,var(--accent))}
button.placa{cursor:pointer}
.placa>span{display:block}
.placa .pl-t{font-weight:600;color:var(--muted);font-size:.92rem;margin-bottom:6px}
.placa .hora{font-family:var(--cond);font-weight:700;font-size:3.6rem;line-height:.95}
.placa .quando{font-family:var(--cond);font-weight:600;font-size:1.2rem;margin-top:2px}
.placa .maq{font-family:var(--cond);font-weight:700;font-size:1.9rem;line-height:1;margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.placa .oque{font-size:1.1rem;font-weight:600;margin-top:6px}
.placa .pl-s{color:var(--muted);font-size:.92rem}
.ev{display:grid;grid-template-columns:58px 46px minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ev.nomq{grid-template-columns:58px minmax(0,1fr)}
.card>h2+.ev,.card>h3+.ev,.forno-h+.ev,.maq-h+.ev{border-top:0}
.ev .h{font-family:var(--cond);font-weight:700;font-size:1.2rem;line-height:1}
.ev .h small{display:block;font-family:var(--font);font-weight:500;font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.2}
.ev .mq{font-family:var(--cond);font-weight:700;font-size:1.2rem;line-height:1}
.ev .d{min-width:0}
.ev .l1{display:block;font-weight:600;overflow-wrap:anywhere}
.ev .l2{display:block;font-size:.85rem;color:var(--muted)}
.ev .fl{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.ev.passado{opacity:.5}
.vis{display:block;width:100%;text-align:left;background:var(--ag-geral-bg);border:0;border-left:4px solid var(--ag-geral);border-radius:6px;padding:10px 12px;margin-top:8px;font:inherit;color:inherit;cursor:pointer}
.vis>b{display:block;font-family:var(--cond);font-size:1.15rem}
.vis>span{display:block;font-weight:600}
.vis>small{display:block;color:var(--muted);font-size:.85rem}
.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:12px}
.dias button{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px 6px;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.dias button span{font-size:.68rem;color:var(--muted)}
.dias button b{font-family:var(--cond);font-size:1.15rem;line-height:1}
.dias button i{font-style:normal;font-size:.7rem;font-weight:700;color:var(--ag-troca);min-height:1em}
.dias button[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--primary-soft)}
.dias button.hoje::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,#18222D 6px 12px)}
.forno-h{font-family:var(--cond);font-weight:700;font-size:1.15rem;margin:14px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.maq-h{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;font-size:1.2rem;margin-top:10px}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.tog i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tog[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 12px;margin:0 0 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:14px}
.nums div{background:var(--surface-2);border-radius:6px;padding:6px 8px}
.nums span{display:block;color:var(--muted);font-size:.75rem}
.nums b{font-family:var(--cond);font-size:1.15rem}
.aviso{background:var(--primary-soft);border-left:4px solid var(--primary);padding:9px 12px;border-radius:6px;font-size:.92rem}
.alerta{background:var(--a-bg);color:var(--a-fg);border-radius:8px;padding:9px 12px;font-weight:600;font-size:.9rem;margin:10px 0 0}
details.mud summary{cursor:pointer;font-weight:600}
details.mud ul{list-style:none;margin:10px 0 0;padding:0}
details.mud li{padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
details.mud li b{font-family:var(--cond);font-size:1.05rem}
.riscado{text-decoration:line-through;color:var(--muted)}
.sheet-f.one{grid-template-columns:1fr}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;max-width:880px;margin:0 auto}
.tabbar button{flex:1;border:0;background:none;font:inherit;font-size:.68rem;font-weight:600;color:var(--muted);padding:8px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;position:relative;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--primary)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

/* painel */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,14,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:14px;padding-bottom:16px}}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}

<script>
(function(){
'use strict';

/* ---------- dados ---------- */
const KEYS={escalas:'w_escalas',funcionarios:'w_funcs',eventos:'w_eventos',extras:'w_extras',maquinas:'w_maquinas',tiposTroca:'w_trocas',tarefas:'w_tarefas',trocasTurma:'w_trocas_turma',historicoZap:'w_historico_zap',agVig:'w_agenda_vig',agAnt:'w_agenda_ant',agEv:'w_agenda_eventos',limites:'w_limites',equipes:'w_equipes'};
const ARR=['escalas','funcionarios','eventos','extras','maquinas','tiposTroca','tarefas','trocasTurma'];
const S={};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);

function load(){
  ARR.forEach(k=>{let v=null;try{v=JSON.parse(localStorage.getItem(KEYS[k]))}catch(e){} S[k]=Array.isArray(v)?(k==='maquinas'?v.filter(x=>typeof x==='string'||typeof x==='number').map(String):v.filter(x=>x&&typeof x==='object')):[];});
  let h=null;try{h=JSON.parse(localStorage.getItem(KEYS.historicoZap))}catch(e){}
  S.historicoZap=(h&&typeof h==='object'&&!Array.isArray(h))?h:{};
  S.tarefas.forEach(t=>{if(!t.id)t.id=uid();});
  let ae=null;try{ae=JSON.parse(localStorage.getItem(KEYS.agEv))}catch(e){} S.agEv=Array.isArray(ae)?ae:[];
  let li=null;try{li=JSON.parse(localStorage.getItem(KEYS.limites))}catch(e){} S.limites=(li&&typeof li==='object'&&!Array.isArray(li))?li:{};
  let eqs=null;try{eqs=JSON.parse(localStorage.getItem(KEYS.equipes))}catch(e){}
  S.equipes=Array.isArray(eqs)?eqs.filter(x=>x&&x.id&&x.nome):[{id:'prod',nome:'Produção',ativo:true},{id:'am',nome:'Amostra',ativo:true},{id:'proc',nome:'Processo',ativo:true}];
  ['agVig','agAnt'].forEach(k=>{let o=null;try{o=JSON.parse(localStorage.getItem(KEYS[k]))}catch(e){} S[k]=(o&&typeof o==='object'&&Array.isArray(o.eventos))?o:null;});
}
function save(){
  try{Object.keys(KEYS).forEach(k=>localStorage.setItem(KEYS[k],JSON.stringify(S[k])));}
  catch(e){toast('Não foi possível salvar neste navegador. Exporte um backup.');}
}

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hojeStr=()=>ymd(new Date());
const br=s=>s?String(s).split('-').reverse().join('/'):'';
const brCurto=s=>s?br(s).slice(0,5):'';
const parse=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const AREAS=['Troca de Moldes','Produção'];
const TURNOS=['Manhã','Tarde','Noite'];
const TIPOS=['Férias','Previsão de Férias','Falta','Afastado','Folga Acerto'];
/* Previsão de férias: só o mês; a pessoa conta como fora do quadro no mês inteiro */
const PREV='Previsão de Férias';
const prevMes=e=>e.mes||String(e.inicio||'').slice(0,7);
const mesNome=m=>{const [y,mm]=String(m).split('-').map(Number);return y&&mm?new Date(y,mm-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}):'';};
const temPrev=(f,mes)=>S.eventos.some(e=>e.tipo===PREV&&String(e.drt)===String(f.drt)&&prevMes(e)===mes);
function prevCardCal(gente){
  const ps=gente.filter(f=>temPrev(f,ui.mes));if(!ps.length)return '';
  return `<div class="card"><h2>Previsão de férias em ${esc(mesNome(ui.mes))}</h2><div class="names">${ps.map(f=>`<span class="chip s-ferias">${esc(f.nome)}</span>`).join('')}</div></div>`;
}
const areaOf=f=>f.area||'Troca de Moldes';
const areaOk=(flt,f)=>!flt||flt==='Todas'||areaOf(f)===flt;
const turmaOrig=f=>f.escalaNome||f.escala||'';
const ativos=()=>S.funcionarios.filter(f=>f.ativo!==false);
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const diaSemana=s=>parse(s).toLocaleDateString('pt-BR',{weekday:'long'});

const IC={
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  send:'<path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',
  check:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',
  grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  done:'<path d="m5 12 5 5 9-10"/>',
  agenda:'<rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><path d="M9 11h6M9 15h6"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  calx:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 13l4 4M14 13l-4 4"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  swap:'<rect x="2" y="2" width="20" height="20" rx="2.5" stroke-width="1.6"/><path d="M12 2v20M2 12h20" stroke-width="1.6"/><g fill="currentColor" stroke="none" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="8" text-anchor="middle" dominant-baseline="central"><text x="7" y="7.4">1</text><text x="17" y="7.4">2</text><text x="7" y="17.4">3</text><text x="17" y="17.4">4</text></g>',
  cycle:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  tag:'<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  warn:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

function opts(list,val){
  return list.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}"${String(v)===String(val??'')?' selected':''}>${esc(l)}</option>`;}).join('');
}
const fld=(label,inner)=>`<label class="fld"><span>${label}</span>${inner}</label>`;
const seg=(key,list,val)=>`<div class="seg" role="group">${list.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<button type="button" data-act="seg" data-k="${key}" data-v="${esc(v)}" aria-pressed="${String(v)===String(val)}">${esc(l)}</button>`;}).join('')}</div>`;
const areaChip=f=>`<span class="chip area">${esc(areaOf(f))}</span>`;

function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),ms);}

/* ---------- regras de escala ---------- */
function turmaNoDia(d,f){
  const id=String(f.drt);
  const v=S.trocasTurma.filter(t=>String(t.drt)===id&&!(t.dataInicio&&d<t.dataInicio)&&!(t.dataFim&&d>t.dataFim));
  if(v.length){v.sort((a,b)=>(b.dataInicio||'').localeCompare(a.dataInicio||''));return v[0].novaEscala;}
  return turmaOrig(f);
}
function statusNoDia(d,f){
  const id=String(f.drt);
  if(S.extras.some(e=>String(e.drt)===id&&e.data===d))return{status:'Extra',c:'extra'};
  const ev=S.eventos.find(e=>String(e.drt)===id&&d>=e.inicio&&d<=e.fim);
  if(ev){let c='falta';const t=(ev.tipo||'').toLowerCase();if(t.includes('fér'))c='ferias';if(ev.tipo==='Folga Acerto')c='folga';return{status:ev.tipo,c};}
  if(S.trocasTurma.some(t=>String(t.drt)===id&&t.folgaAcerto===d))return{status:'Folga Acerto',c:'folga'};
  const e=S.escalas.find(x=>x.nome===turmaNoDia(d,f));
  if(e&&e.inicio){const df=diffDays(e.inicio,d);if(df>=0&&df%8<6)return{status:'Trabalhando',c:'trabalho'};}
  return{status:'Folga',c:'folga'};
}
function turmasDeFolga(d){
  return S.escalas.filter(e=>{if(!e.inicio)return false;const df=diffDays(e.inicio,d);return df>=0&&df%8>=6;}).map(e=>e.nome);
}
function folgaChip(d){
  const fol=turmasDeFolga(d);if(!fol.length)return '';
  return `<span class="chip s-folga folga-chip">${esc(fol.map(n=>/^turma/i.test(n)?n:'Turma '+n).join(' e '))} de folga</span>`;
}
/* Limite: mínimo de pessoas trabalhando por turno em cada área */
function abaixoLimite(d,area,turno){
  const out=[];
  AREAS.forEach(a=>{
    if(area&&area!=='Todas'&&a!==area)return;
    const L=S.limites&&S.limites[a];if(!L||!L.ativo||!(L.min>0))return;
    TURNOS.forEach(t=>{
      if(turno&&turno!=='Todos'&&t!==turno)return;
      const ps=ativos().filter(f=>areaOf(f)===a&&f.turno===t);if(!ps.length)return;
      const n=ps.filter(f=>{const c=statusNoDia(d,f).c;return c==='trabalho'||c==='extra';}).length;
      if(n<L.min)out.push({a,t,n,min:L.min});
    });
  });
  return out;
}
function limiteAviso(lst){
  if(!lst.length)return '';
  return `<div class="alerta"><b>Abaixo do limite</b>${lst.map(x=>`<br>${esc(x.a)}, ${esc(x.t)}: ${x.n} trabalhando (mínimo ${x.min})`).join('')}</div>`;
}
const GRUPOS=[['trabalho','Trabalhando'],['extra','Extra'],['folga','Folga'],['ferias','Férias'],['falta','Ausência']];
function periodo(t){const a=t.dataInicio||t.data,b=t.dataFim;if(a&&b)return `${br(a)} a ${br(b)}`;if(a)return br(a);if(b)return `até ${br(b)}`;return '';}

/* ---------- agenda: planilha de trocas do PCP ---------- */
const AQ=(()=>{
  const norm=s=>String(s??'').trim();
  const normCode=s=>norm(s).toUpperCase().replace(/\s+/g,'');
  const num=s=>{const t=norm(s).replace(',','.');if(t==='')return null;const n=Number(t);return Number.isFinite(n)?n:null;};
  const fornoDe=mq=>{const m=norm(mq).toUpperCase();if(!m)return null;return /^\d/.test(m)?'1':m[0];};
  function serialToISO(n){return new Date(Math.round((n-25569)*86400000)).toISOString().slice(0,10);}
  const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  function umaData(v){
    if(/^\d{5}(\.0+)?$/.test(v)){const n=Number(v);if(n>40000&&n<60000)return serialToISO(n);}
    let m=v.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})\b/);if(m)return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
    m=v.toLowerCase().match(/(\d{1,2})\s+de\s+([a-zç]+)\s+de\s+(\d{4})/);if(m){const i=MESES.indexOf(m[2]);if(i>=0)return `${m[3]}-${String(i+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
    return null;
  }
  function parseDateCell(cells){
    const vals=cells.map(norm).filter(v=>v!=='');
    if(vals.length===0||vals.length>3)return null;
    for(const v of vals){const d=umaData(v);if(d)return d;}
    return vals.length>1?umaData(vals.join(' ')):null;
  }
  function parseHora(v){
    const t=norm(v);
    if(/^qtd/i.test(t))return{hora:null,gatilho:'qtde'};
    const m=t.match(/^(\d{1,2}):(\d{2})/);
    if(m)return{hora:`${m[1].padStart(2,'0')}:${m[2]}`,gatilho:null};
    const n=num(t);
    if(n!==null&&n>0&&n<1){const mins=Math.round(n*1440);return{hora:`${String(Math.floor(mins/60)%24).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`,gatilho:null};}
    return{hora:null,gatilho:null};
  }
  function horaDaNota(txt){
    const m=txt.match(/\b[AÀ]S\s*(\d{1,2})(?:\s*[:H]\s*(\d{2}))?\s*H?\b/i);
    if(!m)return null;const h=Number(m[1]);if(h>23)return null;
    return `${String(h).padStart(2,'0')}:${m[2]||'00'}`;
  }
  function idxMap(h1,h2){
    const f=(row,re,from=0)=>{for(let i=from;i<row.length;i++)if(re.test(norm(row[i])))return i;return -1;};
    const iMQ=f(h2,/^MQ$/i),iSai=f(h2,/^Frasco$/i),iEnt=f(h2,/^Frasco$/i,iSai+1),iQtd=f(h2,/^Quantidades/i),iHoras=f(h2,/^Horas$/i),iQ1=f(h2,/^QTDE$/i);
    return{mq:iMQ,saiFr:iSai,saiCor:iSai+1,saiProc:iSai+2,qmin:iQtd,qmax:iQtd+1,
      hora:f(h1,/^Hor[áa]rio/i),tipo:f(h1,/^Tipo/i),entFr:iEnt,entCor:iEnt+1,entProc:iEnt+2,
      sec:f(h1,/^Se[çc]/i),vel:f(h1,/^Vel/i),peso:f(h1,/^Peso/i),cot:f(h1,/^Cot/i),ext:f(h1,/^Ext/i),
      horas:iHoras,dias:f(h2,/^Dias$/i),qd:iQ1,qp:f(h2,/^QTDE$/i,iQ1+1),desc:f(h2,/^Descri/i),emb:f(h2,/^Emb/i),cli:f(h2,/^CLIENTE$/i)};
  }
  function classificar(sai,ent){const E=ent.toUpperCase();if(/PARADA/.test(E))return 'parada';if(/AMOSTRA/.test(E))return 'amostra';return 'troca';}
  function parsePlanilha(text){
    let t=String(text||'').replace(/\r/g,'');
    const s=t.search(/===\s*Sheet:\s*Troca\s*===/i);
    if(s>=0){t=t.slice(s).replace(/^.*\n/,'');const e=t.search(/\n===\s*Sheet:/i);if(e>=0)t=t.slice(0,e);}
    const lines=t.split('\n').map(l=>l.split('\t'));
    const eventos=[],backups={},avisos=[];
    let data=null,map=null,h1=null;
    for(let i=0;i<lines.length;i++){
      const c=lines[i];
      const joined=c.map(norm).filter(Boolean).join(' ');
      if(!joined)continue;
      const d=parseDateCell(c);
      if(d){data=d;continue;}
      if(/Hor[áa]rio/i.test(joined)&&/Entrada/i.test(joined)){h1=c;continue;}
      if(/^MQ\b/i.test(norm(c[0]))&&/Frasco/i.test(joined)){if(h1)map=idxMap(h1,c);continue;}
      if(/^Min\.?\s+M[áa]x/i.test(joined)||/Progr\. \(h\)/i.test(joined))continue;
      if(!data)continue;
      const nm=joined.match(/^([A-Z]?\d{1,2})\s*:\s*(.+)$/i);
      if(nm&&(!map||!norm(c[map.entFr]))){
        const mq=nm[1].toUpperCase(),tit=nm[2].replace(/\s+/g,' ').trim();
        const isT2=/\bT2\b|\bTIPO\b/i.test(tit);
        const acao=/IN[IÍ]CIO/i.test(tit)?'inicio':/T[EÉ]RMINO|\bFIM\b/i.test(tit)?'fim':'';
        const produto=(tit.match(/[A-Z]{2}\s*-\s*\d{3,4}-[A-Z0-9]+/i)||[''])[0];
        eventos.push({origem:'planilha',kind:isT2?'t2':'nota',acao,produto,data,hora:horaDaNota(tit),gatilho:null,maquina:mq,forno:fornoDe(mq),titulo:tit,codigo:'',importante:true});
        continue;
      }
      if(!map)continue;
      const g=k=>(map[k]>=0?norm(c[map[k]]):'');
      const mq=g('mq').toUpperCase(),sai=g('saiFr'),ent=g('entFr');
      if(mq==='0'||/^0$/.test(sai))continue;
      if(!mq){
        if(!ent||/^BKP$/i.test(ent))continue;
        (backups[data]=backups[data]||[]).push({frasco:ent,cor:g('entCor'),proc:g('entProc'),descricao:g('desc'),cliente:g('cli'),horas:num(g('horas')),qtdProg:num(g('qp'))});
        continue;
      }
      if(!sai&&!ent)continue;
      const h=parseHora(g('hora'));
      const ev={origem:'planilha',kind:classificar(sai,ent),data,hora:h.hora,gatilho:h.gatilho,maquina:mq,forno:fornoDe(mq),codigo:g('tipo').toUpperCase(),
        saida:{frasco:sai,cor:g('saiCor'),proc:g('saiProc'),qmin:num(g('qmin')),qmax:num(g('qmax'))},
        entrada:{frasco:ent,cor:g('entCor'),proc:g('entProc'),secoes:num(g('sec')),vel:num(g('vel')),peso:num(g('peso')),cot:num(g('cot')),ext:num(g('ext')),

      <button class="btn sm" data-act="cal-today">Hoje</button>

    <div class="row" style="margin-bottom:12px">
      <select class="grow" data-bind="calTurno" aria-label="Turno">${opts([['Todos','Todos os turnos'],...TURNOS],ui.calTurno)}</select>

  </div>${det}${prevCardCal(gente)}`;

function vDiario(){
  const d=ui.agData;
  const gente=ativos().filter(f=>areaOk(ui.agArea,f)&&(ui.agTurno==='Todos'||f.turno===ui.agTurno)).map(f=>({f,r:statusNoDia(d,f)}));
  const resumo=GRUPOS.map(([c,l])=>{const n=gente.filter(x=>x.r.c===c).length;return n?`<span class="chip s-${c}">${l}: ${n}</span>`:'';}).join('');
  const grupos=GRUPOS.map(([c,l])=>{
    const ps=gente.filter(x=>x.r.c===c);if(!ps.length)return '';
    return `<div class="card"><h2>${l} <span class="muted">(${ps.length})</span></h2><ul class="list">${ps.map(({f,r})=>`<li class="item"><div class="main"><div class="t">${esc(f.nome)}</div><div class="m">DRT ${esc(f.drt)}, ${esc(f.turno)}, ${esc(turmaNoDia(d,f)||'sem turma')} ${areaChip(f)}</div></div><span class="chip s-${c}">${esc(r.status)}</span></li>`).join('')}</ul></div>`;
  }).join('');
  return `<h1>Diário</h1><div class="card">
    <div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><button class="icon-btn" data-act="ag-step" data-n="-1" aria-label="Dia anterior">${ic('chevL')}</button>
      <input type="date" id="agData" data-bind="agData" data-req="1" value="${d}" aria-label="Data">
      <button class="icon-btn" data-act="ag-step" data-n="1" aria-label="Próximo dia">${ic('chevR')}</button></div>
    <div class="row" style="margin-bottom:10px"><span class="small muted" style="text-transform:capitalize">${esc(diaSemana(d))}${d===hojeStr()?', hoje':''}</span>${folgaChip(d)}</div>
    <div class="row" style="margin-bottom:10px">
      <select class="grow" data-bind="agTurno" aria-label="Turno">${opts([['Todos','Todos os turnos'],...TURNOS],ui.agTurno)}</select>
      <select class="grow" data-bind="agArea" aria-label="Área">${opts([['Todas','Todas as áreas'],...AREAS],ui.agArea)}</select>
    </div>
    <div class="row">${resumo||'<span class="muted small">Ninguém nesse filtro.</span>'}</div>
    ${limiteAviso(abaixoLimite(d,ui.agArea,ui.agTurno))}
  </div>${grupos}`;
}

function vEscala(){
  ensureZap();
  const ws=zapWorkers();
  ws.forEach(f=>{if(!zap.linhas[String(f.drt)])zap.linhas[String(f.drt)]=[{maq:'',tro:''}];});
  const maqO=v=>`<option value="">Máquina</option>`+opts(S.maquinas,v);
  const troO=v=>`<option value="">Troca</option>`+opts(S.tiposTroca.map(t=>t.sigla),v);
  const salva=!!S.historicoZap[zap.key];
  const workers=ws.length?ws.map(f=>{
    const id=String(f.drt),ex=statusNoDia(zap.data,f).status==='Extra';
    const rows=zap.linhas[id].map((l,j)=>`<div class="mrow">
      <select data-zap="maq" data-drt="${esc(id)}" data-j="${j}" aria-label="Máquina de ${esc(f.nome)}">${maqO(l.maq)}</select>
      <select data-zap="tro" data-drt="${esc(id)}" data-j="${j}" aria-label="Troca de ${esc(f.nome)}">${troO(l.tro)}</select>
      ${j===0?`<button type="button" class="icon-btn" data-act="zap-addline" data-drt="${esc(id)}" aria-label="Adicionar outra máquina para ${esc(f.nome)}">${ic('plus')}</button>`
             :`<button type="button" class="icon-btn danger" data-act="zap-delline" data-drt="${esc(id)}" data-j="${j}" aria-label="Remover máquina">${ic('x')}</button>`}
    </div>`).join('');
    return `<div class="wk${ex?' extra':''}"><div class="nm">${esc(f.nome)}${ex?' <span class="chip s-extra">Extra</span>':''}</div>${rows}</div>`;
  }).join(''):`<div class="empty"><p>Ninguém da Troca de Moldes trabalha neste dia e turno.</p><p class="small">Confira as turmas e o turno de cada colaborador em Mais.</p></div>`;
  const bloco=eq=>{
    const k=eq.id,label=esc(eq.nome),p=zap.pend[k]||(zap.pend[k]={maq:'',tro:''}),lst=zap.blocos[k]||(zap.blocos[k]=[]);
    return `<div class="blk"><h3>${label}</h3><div class="mrow">
      <select data-zap="pend" data-k="${esc(k)}" data-f="maq" aria-label="Máquina para ${label}">${maqO(p.maq)}</select>
      <select data-zap="pend" data-k="${esc(k)}" data-f="tro" aria-label="Troca para ${label}">${troO(p.tro)}</select>
      <button type="button" class="icon-btn add" data-act="zap-add" data-k="${esc(k)}" aria-label="Adicionar em ${label}">${ic('plus')}</button></div>
      <div class="tags">${lst.map((v,j)=>`<span class="tag">${esc(v)}<button type="button" data-act="zap-deltag" data-k="${esc(k)}" data-j="${j}" aria-label="Remover ${esc(v)}">${ic('x')}</button></span>`).join('')}</div></div>`;
  };
  const eqsAtivas=S.equipes.filter(e=>e.ativo!==false);
  const tars=zapTarefas();
  return `<div class="titlebar"><h1>Escala</h1>${salva?'<span class="chip s-trabalho">Já salva</span>':''}</div>
  <div class="card">
    <label class="fld"><span>Data</span><input type="date" id="zapData" data-zap="data" value="${zap.data}"></label>
    ${folgaChip(zap.data)?`<div style="margin:-2px 0 12px">${folgaChip(zap.data)}</div>`:''}
    ${seg('zapTurno',TURNOS,zap.turno)}
  </div>
  ${agEscalaCard()}
  <div class="card"><h2>Troca de Moldes</h2>${!S.maquinas.length?'<p class="small muted">Cadastre as máquinas em Mais para preencher a escala.</p>':''}${workers}</div>
  ${eqsAtivas.length?`<div class="card">${eqsAtivas.map(bloco).join('')}</div>`:''}
  ${tars.length?`<div class="card"><h2>Lembretes e tarefas</h2><p class="small muted">Marque o que deve entrar na mensagem.</p>${tars.map(t=>`<label class="check"><input type="checkbox" data-zap="tar" value="${esc(t.id)}"${zap.tarefas.includes(t.id)?' checked':''}><span><b>${esc(t.maquina||'Lembrete')}</b>: ${esc(t.descricao)}${periodo(t)?` <span class="muted small">(${esc(periodo(t))})</span>`:''}</span></label>`).join('')}</div>`:''}
  <div class="card"><label class="fld" style="margin:0"><span>Observações do dia</span><textarea id="zapNotas" data-zap="notas" placeholder="Algo importante para esta escala">${esc(zap.notas)}</textarea></label></div>
  <div class="card"><h2>Mensagem</h2><pre class="bubble" id="preview"></pre>
    <div class="actions"><button type="button" class="btn primary block" data-act="zap-save">Salvar e copiar</button>
    <a class="btn block" id="waLink" href="#" target="_blank" rel="noopener" data-act="zap-wa">Salvar e abrir no WhatsApp</a></div></div>`;
}

function vTarefas(){
  const list=S.tarefas.map((t,i)=>({t,i})).filter(x=>ui.tarFiltro==='Todas'||x.t.status===ui.tarFiltro);
  return `<div class="titlebar"><h1>Tarefas</h1><button class="btn primary sm" data-act="new" data-t="tarefa">${ic('plus')} Nova</button></div>
  <div style="margin-bottom:12px">${seg('tarFiltro',[['Aberta','Abertas'],['Concluida','Concluídas'],['Todas','Todas']],ui.tarFiltro)}</div>
  <div class="card">${list.length?`<ul class="list">${list.map(({t,i})=>{const ab=t.status==='Aberta';return `<li class="item"><div class="main">
      <div class="t${ab?'':' done'}">${esc(t.descricao)}</div>
      <div class="m"><span class="chip neutral">${esc(t.maquina||'Lembrete')}</span>${periodo(t)?esc(periodo(t)):''}</div></div>
      <div class="acts"><button class="icon-btn" data-act="tar-toggle" data-i="${i}" aria-label="${ab?'Concluir':'Reabrir'}" title="${ab?'Concluir':'Reabrir'}">${ic(ab?'done':'undo')}</button>
      <button class="icon-btn" data-act="edit" data-t="tarefa" data-i="${i}" aria-label="Editar">${ic('edit')}</button>
      <button class="icon-btn danger" data-act="del" data-t="tarefa" data-i="${i}" aria-label="Excluir">${ic('trash')}</button></div></li>`;}).join('')}</ul>`
    :`<div class="empty"><p>${ui.tarFiltro==='Concluida'?'Nenhuma tarefa concluída.':'Nenhuma tarefa aberta.'}</p></div>`}</div>
  <p class="small muted">Tarefas com data aparecem na escala daquele dia. Sem data, aparecem quando a máquina dela está na escala.</p>`;
}

const MENU=[
  ['ausencias','Ausências','Férias, faltas, afastamentos e folgas de acerto',()=>S.eventos.length,'calx'],
  ['extras','Trabalho extra','Quem veio trabalhar na folga',()=>S.extras.length,'timer'],
  ['mudanca','Mudança de Turma','Troca de turma a partir de uma data',()=>S.trocasTurma.length,'swap'],
  ['turmas','Turmas','Ciclos 6x2 e onde cada um começa',()=>S.escalas.length,'cycle'],
  ['equipe','Equipe','Colaboradores, área, turno e turma',()=>ativos().length,'users'],
  ['maquinas','Máquinas','Lista usada na escala e nas tarefas',()=>S.maquinas.length,'gear'],
  ['siglas','Siglas de troca','Siglas e legenda da mensagem',()=>S.tiposTroca.length,'tag'],
  ['equipes','Equipes da escala','Produção, Amostra, Processo e outras',()=>S.equipes.filter(e=>e.ativo!==false).length,'layers'],
  ['limite','Limite','Mínimo de pessoas trabalhando por área',()=>Object.values(S.limites).filter(l=>l&&l.ativo&&l.min>0).length||'','warn'],
  ['sistema','Backup e dados','Exportar, importar ou apagar',()=>'','db']
];
function vMais(){
  return `<h1>Mais</h1><div class="menu">${MENU.map(([k,t,d,n,i])=>`<button type="button" data-act="open" data-v="${k}"><span class="mi">${ic(i)}</span><div class="tx"><b>${t}</b><span>${d}</span></div><span class="ct">${n()}</span>${ic('chevR')}</button>`).join('')}</div>`;
}
const subHead=(titulo,novo,label='Novo')=>`<button class="btn ghost sm" data-act="back">${ic('chevL')} Mais</button>
  <div class="titlebar"><h1>${titulo}</h1>${novo?`<button class="btn primary sm" data-act="new" data-t="${novo}">${ic('plus')} ${label}</button>`:''}</div>`;
const acts=(t,i,edit=true)=>`<div class="acts">${edit?`<button class="icon-btn" data-act="edit" data-t="${t}" data-i="${i}" aria-label="Editar">${ic('edit')}</button>`:''}<button class="icon-btn danger" data-act="del" data-t="${t}" data-i="${i}" aria-label="Excluir">${ic('trash')}</button></div>`;
const vazio=(msg)=>`<div class="empty"><p>${msg}</p></div>`;
const byDrt=d=>S.funcionarios.find(f=>String(f.drt)===String(d));

const SUBS={
  extras(){
    const list=S.extras.map((e,i)=>({e,i,f:byDrt(e.drt)})).filter(x=>x.f&&areaOk(ui.exArea,x.f)).sort((a,b)=>b.e.data.localeCompare(a.e.data));
    return subHead('Trabalho extra','extra','Registrar')+`<div style="margin-bottom:12px"><select data-bind="exArea" aria-label="Área">${opts([['Todas','Todas as áreas'],...AREAS],ui.exArea)}</select></div>
    <div class="card">${list.length?`<ul class="list">${list.map(({e,i,f})=>`<li class="item"><div class="main"><div class="t">${esc(f.nome)}</div><div class="m">${br(e.data)}, ${esc(f.turno)} ${areaChip(f)}</div></div>${acts('extra',i,false)}</li>`).join('')}</ul>`:vazio('Nenhum extra registrado.')}</div>`;
  },
  ausencias(){
    const list=S.eventos.map((e,i)=>({e,i,f:byDrt(e.drt)})).filter(({e,f})=>f&&areaOk(ui.evArea,f)&&(ui.evTipo==='Todos'||e.tipo===ui.evTipo)&&(ui.evTurno==='Todos'||f.turno===ui.evTurno)&&(!ui.evDesde||e.fim>=ui.evDesde)).sort((a,b)=>b.e.inicio.localeCompare(a.e.inicio));
    const nFil=[ui.evTipo!=='Todos',ui.evTurno!=='Todos',ui.evArea!=='Todas',!!ui.evDesde].filter(Boolean).length;
    const cls=t=>{t=(t||'');if(t.toLowerCase().includes('fér'))return 'ferias';if(t==='Folga Acerto')return 'folga';return 'falta';};
    return subHead('Ausências','evento')+`<div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="ev-filtros" aria-expanded="${ui.evFiltros}">Filtros${nFil?` (${nFil})`:''}</button>${nFil?'<button class="btn sm ghost" data-act="ev-limpar">Limpar filtros</button>':''}</div>
    ${ui.evFiltros?`<div class="card"><div class="grid2">
      ${fld('Tipo',`<select data-bind="evTipo">${opts([['Todos','Todos'],...TIPOS],ui.evTipo)}</select>`)}
      ${fld('Turno',`<select data-bind="evTurno">${opts([['Todos','Todos'],...TURNOS],ui.evTurno)}</select>`)}
      ${fld('Área',`<select data-bind="evArea">${opts([['Todas','Todas'],...AREAS],ui.evArea)}</select>`)}
      ${fld('Ainda valendo em',`<input type="date" data-bind="evDesde" value="${ui.evDesde}">`)}</div></div>`:''}
    <div class="card">${list.length?`<ul class="list">${list.map(({e,i,f})=>`<li class="item"><div class="main"><div class="t">${esc(f.nome)}</div><div class="m"><span class="chip s-${cls(e.tipo)}">${esc(e.tipo)}</span>${e.tipo===PREV?esc(mesNome(prevMes(e))):e.inicio===e.fim?br(e.inicio):`${br(e.inicio)} a ${br(e.fim)}`}, ${esc(f.turno)}</div></div>${acts('evento',i)}</li>`).join('')}</ul>`:vazio('Nenhuma ausência encontrada.')}</div>`;
  },
  equipe(){
    const q=ui.fBusca.trim().toLowerCase();
    const list=S.funcionarios.map((f,i)=>({f,i})).filter(({f})=>areaOk(ui.fArea,f)&&(!q||String(f.nome).toLowerCase().includes(q)||String(f.drt).includes(q))).sort((a,b)=>(a.f.ativo===false)-(b.f.ativo===false)||String(a.f.nome).localeCompare(String(b.f.nome),'pt-BR'));
    return subHead('Equipe','funcionario')+`<div class="row" style="margin-bottom:12px">
      <input class="grow" id="fBusca" data-live="fBusca" type="search" placeholder="Buscar por nome ou DRT" value="${esc(ui.fBusca)}" aria-label="Buscar">
      <select class="grow" data-bind="fArea" aria-label="Área">${opts([['Todas','Todas as áreas'],...AREAS],ui.fArea)}</select></div>
    <div class="card">${list.length?`<ul class="list">${list.map(({f,i})=>`<li class="item"><div class="main"><div class="t">${esc(f.nome)}${f.ativo===false?' <span class="chip neutral">Inativo</span>':''}</div><div class="m">DRT ${esc(f.drt)}, ${esc(f.turno)}, ${esc(turmaOrig(f)||'sem turma')} ${areaChip(f)}</div></div>${acts('funcionario',i)}</li>`).join('')}</ul>`:vazio(S.funcionarios.length?'Ninguém encontrado.':'Nenhum colaborador cadastrado.')}</div>`;
  },
  turmas(){
    const hoje=hojeStr();
    const info=e=>{
      if(!e.inicio)return '';
      const df=diffDays(e.inicio,hoje);
      if(df<0)return `Ciclo começa em ${br(e.inicio)}`;
      const p=df%8;
      return p<6?`Hoje: ${p+1}º dia de trabalho. Folga a partir de ${brCurto(addDays(hoje,6-p))}`:`Hoje: folga. Volta em ${brCurto(addDays(hoje,8-p))}`;
    };
    return subHead('Turmas','turma','Nova')+`<div class="card">${S.escalas.length?`<ul class="list">${S.escalas.map((e,i)=>`<li class="item"><div class="main"><div class="t">${esc(e.nome)}</div><div class="m">Ciclo desde ${br(e.inicio)}</div><div class="m">${esc(info(e))}</div></div>${acts('turma',i)}</li>`).join('')}</ul>`:vazio('Nenhuma turma cadastrada.')}</div>
    <p class="small muted">Cada turma segue 6 dias de trabalho e 2 de folga, contando a partir do início do ciclo.</p>`;
  },
  mudanca(){
    const list=S.trocasTurma.map((t,i)=>({t,i,f:byDrt(t.drt)})).filter(x=>x.f&&areaOk(ui.ttArea,x.f)).sort((a,b)=>(b.t.dataInicio||'').localeCompare(a.t.dataInicio||''));
    return subHead('Mudança de Turma','mudanca','Nova')+`<div style="margin-bottom:12px"><select data-bind="ttArea" aria-label="Área">${opts([['Todas','Todas as áreas'],...AREAS],ui.ttArea)}</select></div>
    <div class="card">${list.length?`<ul class="list">${list.map(({t,i,f})=>`<li class="item"><div class="main"><div class="t">${esc(f.nome)}</div>
      <div class="m">${esc(turmaOrig(f)||'sem turma')} para <b>${esc(t.novaEscala)}</b></div>
      <div class="m">${t.dataFim?`${br(t.dataInicio)} a ${br(t.dataFim)}`:`A partir de ${br(t.dataInicio)}, sem fim`}${t.folgaAcerto?` <span class="chip s-folga">Folga acerto ${br(t.folgaAcerto)}</span>`:''}</div></div>${acts('mudanca',i)}</li>`).join('')}</ul>`:vazio('Nenhuma mudança registrada.')}</div>`;
  },
  maquinas(){
    return subHead('Máquinas','maquina','Nova')+`<div class="card">${S.maquinas.length?`<ul class="list">${S.maquinas.map((m,i)=>`<li class="item"><div class="main"><div class="t">${esc(m)}</div></div>${acts('maquina',i)}</li>`).join('')}</ul>`:vazio('Nenhuma máquina cadastrada.')}</div>`;
  },
  siglas(){
    return subHead('Siglas de troca','sigla','Nova')+`<div class="card">${S.tiposTroca.length?`<ul class="list">${S.tiposTroca.map((t,i)=>`<li class="item"><div class="main"><div class="t">${esc(t.sigla)}</div><div class="m">${esc(t.desc)} <span class="chip ${t.mostrarLegenda!==false?'s-trabalho':'neutral'}">${t.mostrarLegenda!==false?'Na legenda':'Fora da legenda'}</span></div></div>${acts('sigla',i)}</li>`).join('')}</ul>`:vazio('Nenhuma sigla cadastrada.')}</div>`;
  },
  equipes(){
    return subHead('Equipes da escala','equipe','Nova')+`<div class="card"><p class="small muted">Equipes que aparecem na Escala junto com a Troca de Moldes, cada uma com suas máquinas e trocas. Desative para esconder sem perder o cadastro.</p>${S.equipes.length?`<ul class="list">${S.equipes.map((e,i)=>`<li class="item"><div class="main"><div class="t">${esc(e.nome)}</div><div class="m">${e.ativo!==false?'<span class="chip s-trabalho">Ativa</span>':'<span class="chip neutral">Inativa</span>'}</div></div><input type="checkbox" data-eq="${i}"${e.ativo!==false?' checked':''} aria-label="Mostrar ${esc(e.nome)} na escala">${acts('equipe',i)}</li>`).join('')}</ul>`:vazio('Nenhuma equipe cadastrada.')}</div>`;
  },
  limite(){
    return subHead('Limite')+`<div class="card"><p class="small muted">Defina o mínimo de pessoas trabalhando em cada turno de cada área. Quando um dia ficar abaixo, o Calendário e o Diário avisam. Extras contam como trabalhando.</p>
    ${AREAS.map(a=>{const L=S.limites[a]||{};return `<div class="lim"><div class="row" style="justify-content:space-between"><b>${esc(a)}</b><label class="switch" style="margin:0"><input type="checkbox" data-lim="ativo" data-area="${esc(a)}"${L.ativo?' checked':''}> Ativo</label></div>
      ${fld('Mínimo trabalhando por turno',`<input type="number" min="1" max="99" inputmode="numeric" data-lim="min" data-area="${esc(a)}" value="${L.min||''}"${L.ativo?'':' disabled'} placeholder="${L.ativo?'Ex.: 4':'Inativo'}">`)}</div>`;}).join('')}</div>`;
  },
  sistema(){
    return subHead('Backup e dados')+`<div class="card"><h2>Neste aparelho</h2>
      <p class="small muted">Os dados ficam salvos neste navegador. Exporte um backup de vez em quando para não perder nada.</p>
      <p>${S.funcionarios.length} colaboradores, ${S.escalas.length} turmas, ${S.eventos.length} ausências, ${S.extras.length} extras, ${S.tarefas.length} tarefas e ${Object.keys(S.historicoZap).length} escalas salvas.</p>
      <div class="actions"><button class="btn primary block" data-act="export">Exportar backup</button><button class="btn block" data-act="import">Importar backup</button></div></div>
      <div class="card"><h2>Apagar tudo</h2><p class="small muted">Remove todos os dados deste aparelho. Não dá para desfazer.</p><button class="btn danger block" data-act="clear-all">Apagar todos os dados</button></div>`;
  }
};

/* ---------- agenda: telas ---------- */
function agMudancas(){
  if(!S.agVig||!S.agAnt)return '';
  const d=AQ.diff(S.agVig.eventos||[],S.agAnt.eventos||[]),va=S.agAnt.versao||{};
  if(!d.length)return `<div class="card"><p class="small muted" style="margin:0">Sem diferenças para a planilha anterior (importada em ${esc(fmtDH(va.sincronizadoEm))}).</p></div>`;
  const qd=(dd,hh,gg)=>`${quandoTxt(dd)} ${hh||(gg==='qtde'?'por qtde':'sem hora')}`;

/* Lê o texto do PDF e agrupa em linhas pela posição na página */
async function pdfLinhas(L,buf){
  const doc=await L.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  const linhas=[];
  for(let n=1;n<=doc.numPages;n++){
    const pg=await doc.getPage(n),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>{const t=L.Util.transform(vp.transform,i.transform);return{s:i.str.trim(),x:t[4],y:t[5],w:i.width||0,h:Math.hypot(t[2],t[3])||8};});
    its.sort((a,b)=>a.y-b.y||a.x-b.x);
    const pls=[];
    for(const it of its){const cur=pls[pls.length-1];if(cur&&Math.abs(cur.y-it.y)<=Math.max(2,Math.min(cur.h,it.h)*0.5))cur.items.push(it);else pls.push({y:it.y,h:it.h,items:[it]});}
    pls.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);l.pg=n;});
    linhas.push(...pls);
  }
  return linhas;
}

  const NEED1=/^(Hor[áa]rio|Tipo|Se[çc]|Vel|Peso|Cot|Ext)/i,NEED2=/^(Horas|Dias|QTDE)$/i,QTD=/^Quantidade/i,MINMAX=/^(Min|M[áa]x)\.?$/i;
  const LIXO=/P[áa]gina\s+\d+\s+de\s+\d+|Preparado por|^Para:|Laborat[óo]rio,\s*PCP|WHEATON BRASIL|Programa[çc][ãa]o das trocas|^\(\s*X\s*1\.000\s*\)$/i;
  const MES={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
  const ctr=i=>i.x+i.w/2;
  let ref=null;
  for(const l of linhas){const t=T(l),m=t.match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m&&/Preparado|P[áa]gina/i.test(t)){ref={a:+m[3],m:+m[2]};break;}}
  if(!ref){const n=new Date();ref={a:n.getFullYear(),m:n.getMonth()+1};}
  const anoDe=mes=>mes-ref.m>6?ref.a-1:ref.m-mes>6?ref.a+1:ref.a;
  const cab=new Map(),pular=new Set();
  linhas.forEach((l,i)=>{
    if(!ehH2(T(l)))return;
    const win=[];
    for(let j=i-4;j<=i+2;j++){
      if(j<0||j>=linhas.length||j===i)continue;const lj=linhas[j];
      if(lj.pg===l.pg&&lj.y>=l.y-15&&lj.y<=l.y+7&&!ehH2(T(lj))){win.push(...lj.items);pular.add(j);}
    }
    cab.set(i,win);
  });
  let cols=null;const out=[];
  const near=c=>{let k=0,b=Infinity;cols.forEach((x,j)=>{const d=Math.abs(x-c);if(d<b){b=d;k=j;}});return k;};
  const place=(items,extra)=>{
    const a=Array(cols.length).fill('');
    [...items].sort((p,q)=>p.x-q.x).forEach(it=>{const c=ctr(it);let k=near(c);if(a[k]&&k+1<cols.length&&!a[k+1]&&c>cols[k])k++;a[k]=a[k]?a[k]+' '+it.s:it.s;});
    if(extra)a.push(extra);return a.join('\t');
  };
  for(let i=0;i<linhas.length;i++){
    if(pular.has(i))continue;
    const l=linhas[i],t=T(l);
    if(LIXO.test(t))continue;
    const bd=t.replace(/\s+/g,'').toLowerCase().match(/(\d{1,2})\/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)/);
    if(bd&&/\*/.test(t)){const mes=MES[bd[2]];out.push(`${anoDe(mes)}-${pad(mes)}-${pad(+bd[1])}`);continue;}
    if(cab.has(i)){
      const hs=cab.get(i),m=[];
      [...l.items,...hs.filter(it=>NEED1.test(it.s)||NEED2.test(it.s)||MINMAX.test(it.s))].map(ctr).sort((a,b)=>a-b).forEach(c=>{if(!m.length||c-m[m.length-1]>=4)m.push(c);});
      cols=m;
      out.push(place(hs.filter(it=>NEED1.test(it.s)),'Horário Entrada'));
      out.push(place(l.items.concat(hs.filter(it=>NEED2.test(it.s)||QTD.test(it.s)))));
      continue;
    }
    if(/^[A-Z]?\d{1,2}\s*:\s*\D/i.test(t)){out.push(t);continue;}
    if(!cols){out.push(l.items.map(i=>i.s).join('\t'));continue;}
    if(l.items.length<=3&&/\d{1,2}\/\d{1,2}\/\d{2,4}|\d{1,2}\s+de\s+[a-zç]+\s+de\s+\d{4}/i.test(t)){out.push(l.items.map(i=>i.s).join('\t'));continue;}
    out.push(place(l.items.map(it=>({...it,s:numBR(it.s)}))));
  }
  return out.join('\n');
}
function carregaXlsx(){return xlsxP||(xlsxP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>{xlsxP=null;no(new Error('xlsx'));};document.head.appendChild(s);}));}
async function agImportar(input){
  const f=input.files&&input.files[0];input.value='';if(!f)return;
  toast('Lendo a planilha…',4000);
  const ehPdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf';
  let p;
  try{
    if(ehPdf){
      let L;try{L=await carregaPdf();}catch(e){toast('Não foi possível carregar o leitor de PDF. Confira a internet e tente de novo.',7000);return;}
      let linhas;try{linhas=await pdfLinhas(L,await f.arrayBuffer());}catch(e){toast('Não consegui abrir o PDF. Confira se o arquivo não está protegido por senha.',8000);return;}
      if(!linhas.length){toast('Esse PDF não tem texto para ler. Ele precisa ser gerado pelo Excel, não uma foto ou digitalização.',9000);return;}
      p=AQ.parsePlanilha(pdfParaTsv(linhas));
      if(!p.eventos.length){toast('Não encontrei trocas no PDF. Ele precisa ter a tabela de trocas com o cabeçalho MQ e Frasco.',9000);return;}
    }else{
      let X;try{X=await carregaXlsx();}catch(e){toast('Não foi possível carregar o leitor de Excel. Confira a internet e tente de novo.',7000);return;}
      const wb=X.read(await f.arrayBuffer(),{type:'array'});
      const nome=wb.SheetNames.find(n=>/^troca$/i.test(n.trim()))||wb.SheetNames.find(n=>/troca/i.test(n));
      if(!nome){toast(`O arquivo não tem a aba Troca. Abas encontradas: ${wb.SheetNames.join(', ')}.`,8000);return;}
      p=AQ.parsePlanilha(X.utils.sheet_to_csv(wb.Sheets[nome],{FS:'\t',rawNumbers:true}));
      if(!p.eventos.length){toast('Não encontrei trocas na aba Troca. Confira se é o arquivo do PCP.',8000);return;}
    }
    const id=`upload:${f.name}:${f.size}:${f.lastModified}`;
    const mesma=!!(S.agVig&&S.agVig.versao&&S.agVig.versao.emailId===id);
    let nMud=null;
    if(S.agVig&&!mesma){S.agAnt=S.agVig;nMud=AQ.diff(p.eventos,S.agAnt.eventos||[]).length;}
    S.agVig={versao:{origem:'upload',emailId:id,recebidoEm:new Date(f.lastModified).toISOString(),sincronizadoEm:new Date().toISOString(),anexo:f.name},eventos:p.eventos,backups:p.backups,avisos:p.avisos,periodo:p.periodo};
    ui.agOff=0;ui.agDiaSel=hojeStr();
    save();render();
    toast(mesma?'Este arquivo já é a versão carregada.':`Planilha importada: ${p.eventos.length} eventos${nMud!=null?`, ${nMud} mudanças em relação à anterior`:''}.`,7000);
  }catch(e){toast('Não consegui ler o arquivo. Use o PDF ou o Excel da planilha de trocas do PCP.',8000);}
}
const normMaq=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/^M(?=\d)/,'');
function agEscalaCard(){
  if(!S.agVig&&!S.agEv.length)return `<p class="small muted">Importe a planilha de trocas na aba Agenda para ver aqui as máquinas que vão trocar neste turno.</p>`;
  const d=zap.data,t=zap.turno,dn=addDays(d,1);
  const noTurno=e=>{const r=evReal(e);if(!r)return false;const h=r.h;
    if(t==='Manhã')return r.d===d&&h>='06:00'&&h<'14:00';
    if(t==='Tarde')return r.d===d&&h>='14:00'&&h<'22:00';
    return (r.d===d&&h>='22:00')||(r.d===dn&&h<'06:00');};
  const evs=agEventos();
  const com=evs.filter(noTurno).sort((a,b)=>agOrdem(a).localeCompare(agOrdem(b)));
  const sem=evs.filter(e=>e.data===d&&!e.hora);
  const usadas=new Set([...Object.values(zap.linhas).flat().map(l=>l.maq),...Object.values(zap.blocos).flat()].filter(Boolean).map(x=>normMaq(String(x).replace(/\s*\(.*\)$/,''))));
  const row=e=>evRow(e,{quando:t==='Noite',extra:e.maquina&&usadas.has(normMaq(e.maquina))?'<span class="chip s-trabalho">Na escala</span>':''});
  return `<div class="card"><h2>Programação do PCP no turno</h2>
    ${com.length?com.map(row).join(''):'<p class="small muted" style="margin:0">Nenhum evento com horário neste turno.</p>'}
    ${sem.length?`<h3 style="margin-top:14px">Sem horário fixo no dia</h3>${sem.map(row).join('')}`:''}</div>`;
}

      <div class="grid2">${fld('Início (opcional)',`<input type="date" name="dataInicio" value="${esc(r.dataInicio||r.data)}">`)}${fld('Fim (opcional)',`<input type="date" name="dataFim" value="${esc(r.dataFim)}">`)}</div>`,
    submit(fd,i){
      const n={maquina:g(fd,'maquina'),descricao:g(fd,'descricao'),dataInicio:g(fd,'dataInicio'),dataFim:g(fd,'dataFim')};
      if(n.dataInicio&&n.dataFim&&n.dataFim<n.dataInicio)return 'A data final vem antes da inicial.';
      if(i<0)S.tarefas.push({id:uid(),...n,status:'Aberta'});
      else{const t=S.tarefas[i];delete t.data;Object.assign(t,n);}
    }
  }
};
function openForm(t,i){
  const F=FORMS[t];if(!F)return;
  const r=i>=0&&t!=='maquina'?S[COL[t]][i]:{};
  openSheet({title:F.title(i),body:F.body(r||{},i),mount:F.mount,submit:(fd,form)=>{
    const err=F.submit(fd,i,form);if(err)return err;
    save();render();toast(i<0?'Salvo.':'Alterações salvas.');
  }});
}
function delItem(t,i){
  let msg='Excluir este registro?';
  if(t==='funcionario')msg=`Excluir ${S.funcionarios[i].nome}? As ausências, extras e mudanças de turma dessa pessoa também serão apagadas.`;
  if(t==='turma'){const n=S.escalas[i].nome,uso=S.funcionarios.filter(f=>turmaOrig(f)===n).length;msg=uso?`A ${n} está ligada a ${uso} colaborador(es), que ficarão sem turma. Excluir mesmo assim?`:`Excluir a ${n}?`;}
  if(t==='maquina')msg=`Excluir a máquina ${S.maquinas[i]}?`;
  if(t==='equipe')msg=`Excluir a equipe ${S.equipes[i].nome}? Ela sai da escala. Para só esconder, desative.`;
  confirmar(msg,'Excluir',()=>{
    if(t==='funcionario'){const d=String(S.funcionarios[i].drt);['eventos','extras','trocasTurma'].forEach(k=>{S[k]=S[k].filter(x=>String(x.drt)!==d);});}
    S[COL[t]].splice(i,1);save();render();toast('Excluído.');
  });
}

/* ---------- backup ---------- */
async function exportar(){
  const data=JSON.stringify({escalas:S.escalas,funcionarios:S.funcionarios,eventos:S.eventos,extras:S.extras,maquinas:S.maquinas,tiposTroca:S.tiposTroca,historicoZap:S.historicoZap,tarefas:S.tarefas,trocasTurma:S.trocasTurma,agendaVig:S.agVig,agendaAnt:S.agAnt,agendaEventos:S.agEv,limites:S.limites,equipes:S.equipes});
  const name=`GE_Backup_${hojeStr()}.json`;
  if(dl){
    try{await dl.save({filename:name,data});toast('Backup exportado.');}
    catch(e){if(e&&e.code==='declined')return;toast('Não foi possível exportar o backup aqui.');}
    return;
  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
  catch(e){toast('Não foi possível exportar o backup aqui.');}
}
function importar(input){
  const file=input.files&&input.files[0];input.value='';if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    let d;try{d=JSON.parse(fr.result);}catch(e){toast('Esse arquivo não é um JSON válido.');return;}
    if(!d||typeof d!=='object'||!Array.isArray(d.funcionarios)){toast('Esse arquivo não parece um backup do GE Wheaton.');return;}
    const resumo=`${d.funcionarios.length} colaboradores, ${(d.escalas||[]).length} turmas e ${(d.eventos||[]).length} ausências`;
    confirmar(`Importar ${resumo}? Os dados atuais deste aparelho serão substituídos.`,'Importar',()=>{
      ARR.forEach(k=>{S[k]=Array.isArray(d[k])?d[k]:[];});
      S.historicoZap=(d.historicoZap&&typeof d.historicoZap==='object'&&!Array.isArray(d.historicoZap))?d.historicoZap:{};
      S.tarefas.forEach(t=>{if(!t.id)t.id=uid();});
      if(Array.isArray(d.equipes))S.equipes=d.equipes.filter(x=>x&&x.id&&x.nome);
      if('limites' in d)S.limites=(d.limites&&typeof d.limites==='object'&&!Array.isArray(d.limites))?d.limites:{};
      if('agendaEventos' in d)S.agEv=Array.isArray(d.agendaEventos)?d.agendaEventos:[];
      if('agendaVig' in d)S.agVig=d.agendaVig||null;
      if('agendaAnt' in d)S.agAnt=d.agendaAnt||null;
      save();zap=null;render();toast('Backup importado.');
    },false);
  };
  fr.onerror=()=>toast('Não foi possível ler o arquivo.');
  fr.readAsText(file);
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset;
  switch(d.act){
    case 'nav':if(d.v==='diario'&&ui.tab!=='diario')ui.agTurno=ui.calTurno;ui.tab=d.v;ui.sub=null;render();top0();break;
    case 'open':ui.sub=d.v;render();top0();break;
    case 'back':ui.sub=null;render();top0();break;
    case 'goto':ui.tab=d.tab;ui.sub=d.sub||null;render();top0();break;
    case 'seg':
      if(d.k==='zapTurno'){zapLoad(zap.data,d.v);}else ui[d.k]=d.v;
      render();break;
    case 'cal-step':{const [y,m]=ui.mes.split('-').map(Number);ui.mes=ymd(new Date(y,m-1+Number(d.n),1)).slice(0,7);render();break;}
    case 'cal-today':ui.mes=hojeStr().slice(0,7);ui.calSel=hojeStr();render();break;
    case 'cal-day':ui.calSel=d.d;render();{const el=$('#dayDetail');if(el)el.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'nearest'});}break;
    case 'go-diario':ui.agData=d.d;ui.agTurno=ui.calTurno;ui.tab='diario';render();top0();break;
    case 'go-escala':zapLoad(d.d,zap?zap.turno:autoTurno().turno);ui.tab='escala';render();top0();break;
    case 'ag-step':ui.agData=addDays(ui.agData,Number(d.n));render();break;
    case 'new':openForm(d.t,-1);break;
    case 'edit':openForm(d.t,Number(d.i));break;
    case 'del':delItem(d.t,Number(d.i));break;
    case 'tar-toggle':{const t=S.tarefas[Number(d.i)];t.status=t.status==='Aberta'?'Concluida':'Aberta';save();render();toast(t.status==='Aberta'?'Tarefa reaberta.':'Tarefa concluída.');break;}
    case 'ev-filtros':ui.evFiltros=!ui.evFiltros;render();break;
    case 'ev-limpar':ui.evTipo='Todos';ui.evTurno='Todos';ui.evArea='Todas';ui.evDesde='';render();break;
    case 'zap-addline':zap.linhas[d.drt].push({maq:'',tro:''});render();break;
    case 'zap-delline':zap.linhas[d.drt].splice(Number(d.j),1);render();break;
    case 'zap-add':{const it=pendItem(d.k);if(!it){toast('Escolha uma máquina primeiro.');break;}const l=zap.blocos[d.k]||(zap.blocos[d.k]=[]);if(!l.includes(it))l.push(it);zap.pend[d.k]={maq:'',tro:''};render();break;}
    case 'zap-deltag':(zap.blocos[d.k]||[]).splice(Number(d.j),1);render();break;
    case 'zap-save':{const txt=zapPersist();render();copiar(txt).then(ok=>toast(ok?'Escala salva e copiada.':'Escala salva. Para copiar, toque e segure no texto da mensagem.'));break;}
    case 'zap-wa':zapPersist();toast('Escala salva.');setTimeout(render,400);break;
    case 'export':exportar();break;
    case 'import':$('#fileImport').click();break;
    case 'clear-all':confirmar('Apagar todos os dados deste aparelho? Isso não pode ser desfeito.','Apagar tudo',()=>{try{Object.values(KEYS).forEach(k=>localStorage.removeItem(k));}catch(e){}load();zap=null;render();toast('Dados apagados.');});break;
    case 'ag-novo':agForm(null);break;
    case 'ag-importar':$('#agArq').click();break;
    case 'ag-filtros':ui.agFiltros=!ui.agFiltros;render();break;
    case 'ag-tf':ui.agFornos.has(d.v)?ui.agFornos.delete(d.v):ui.agFornos.add(d.v);render();break;
    case 'ag-tk':ui.agKinds.has(d.v)?ui.agKinds.delete(d.v):ui.agKinds.add(d.v);render();break;
    case 'ag-ev':agAbrir(d.id);break;
    case 'ag-dia':ui.agDiaSel=d.d;render();break;
    case 'ag-sem':if(d.n==='0'){ui.agOff=0;ui.agDiaSel=hojeStr();}else{ui.agOff+=Number(d.n);ui.agDiaSel=addDays(ui.agDiaSel,Number(d.n));}render();break;
    case 'ag-edit':{const m=S.agEv.find(x=>x.id===d.id);closeSheet();if(m)agForm(m);break;}
    case 'ag-del':{const id=d.id,m=S.agEv.find(x=>x.id===id);closeSheet();if(m)confirmar(`Excluir o evento ${m.titulo}?`,'Excluir',()=>{S.agEv=S.agEv.filter(x=>x.id!==id);save();render();toast('Evento excluído.');});break;}
    case 'sheet-close':closeSheet();break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='fileImport'){importar(el);return;}
  if(el.id==='agArq'){agImportar(el);return;}
  if(el.closest('#sheet'))return;
  if(el.dataset.eq!==undefined){const e=S.equipes[Number(el.dataset.eq)];if(e){e.ativo=el.checked;save();render();toast(`${e.nome} ${e.ativo?'ativada':'inativada'} na escala.`);}return;}
  if(el.dataset.lim){
    const a=el.dataset.area,L=S.limites[a]||(S.limites[a]={ativo:false,min:null});
    if(el.dataset.lim==='ativo')L.ativo=el.checked;else{const v=parseInt(el.value,10);L.min=v>0?v:null;}
    save();render();
    toast(!L.ativo?`Limite de ${a} inativado.`:L.min?`Limite de ${a}: mínimo de ${L.min} por turno.`:`Informe o mínimo para ${a}.`);
    return;
  }
  if(el.dataset.bind){if(el.type==='date'&&el.dataset.req&&!el.value){render();return;}ui[el.dataset.bind]=el.value;render();return;}
  const z=el.dataset.zap;if(!z||!zap)return;
  if(z==='data'){if(el.value){zapLoad(el.value,zap.turno);render();}return;}
  if(z==='maq'||z==='tro'){const l=zap.linhas[el.dataset.drt][Number(el.dataset.j)];l[z]=el.value;render();return;}
  if(z==='pend'){const p=zap.pend[el.dataset.k]||(zap.pend[el.dataset.k]={maq:'',tro:''});p[el.dataset.f]=el.value;updatePreview();return;}
  if(z==='tar'){const id=el.value;zap.tarefas=el.checked?[...new Set([...zap.tarefas,id])]:zap.tarefas.filter(x=>x!==id);updatePreview();}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.live){ui[el.dataset.live]=el.value;render();}
  else if(el.dataset.zap==='notas'&&zap){zap.notas=el.value;updatePreview();}
});

/* ---------- relógio ---------- */
let lastMin=-1;
function tick(){
  const n=new Date();
  if(n.getMinutes()!==lastMin){if(lastMin!==-1&&ui.tab==='agenda'&&sheet.hidden)render();lastMin=n.getMinutes();}
  $('#hora').textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  $('#data').textContent=n.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
}

/* ---------- início ---------- */
tick();load();render();setInterval(tick,15000);
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(x=>{dl=x;}).catch(()=>{});}catch(e){}
})();
</script>
</body>
</html>
